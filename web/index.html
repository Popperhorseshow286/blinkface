<!doctype html>
<meta charset="utf-8">
<title>blinkface · change your face in a blink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 动森风 UI（animal-island-ui 设计规范复刻：羊皮纸 + 暖棕 + 波点 + 3D 像素阴影）===== */
  * { margin: 0; box-sizing: border-box; }
  /* 房间墙纸：羊皮纸波点（Card pattern="default" 同款配方） */
  body { overflow:hidden;
         font:14px/1.4 Nunito,'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
         font-weight:500; letter-spacing:.01em;
         background:
           radial-gradient(circle, rgba(196,184,158,.22) 1.5px, transparent 1.5px) 0 0/28px 28px,
           radial-gradient(circle, rgba(212,201,180,.14) 1px, transparent 1px) 7px 7px/14px 14px,
           #efe9d3; }
  /* 布局：电视视口正中尽量大；面板悬浮左下（动森对话框位），最多压到电视左下角 */
  #stage { position:fixed; inset:0; }
  /* 底部 96px 留给信息卡/操作卡，电视在其上方区域居中，腿也不会踩到卡片 */
  #tvbox { position:absolute; left:0; right:0; top:0; bottom:96px;
           display:flex; align-items:center; justify-content:center; }

  /* 电视机：木质外框 + 圆角屏幕 + 两条小腿 */
  #tv { position:relative; aspect-ratio:16/9;
        width:min(94vw, calc((100vh - 172px) * 16 / 9));
        padding:18px; background:#9a835a; border-radius:36px;
        border:3px solid #7a6544;
        box-shadow:inset 0 3px 0 rgba(255,255,255,.25), 0 14px 28px rgba(61,52,40,.35); }
  #tv::before, #tv::after { content:""; position:absolute; bottom:-24px; width:26px; height:28px;
        background:#7a6544; border-radius:0 0 10px 10px; z-index:-1; }
  #tv::before { left:16%; } #tv::after { right:16%; }
  /* 镜像层：摄像头 + 风格化全图都在这层，整体镜像（自拍视角）。UI 不在这层，不会被翻转 */
  #mirror { position:relative; width:100%; height:100%; overflow:hidden; border-radius:20px;
            background:#1a1712; transform:scaleX(-1);
            box-shadow:inset 0 0 24px rgba(0,0,0,.5); }
  #cam, #styled { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* 风格化全图：和摄像头像素对齐铺满；clip-path 只露出取景框那块 */
  #styled { display:none; }

  /* 信息卡（左下）：Time 组件样式（白→米渐变 + 3px 浅褐边 + 暖棕粗字） */
  #hud { position:absolute; left:14px; bottom:14px; z-index:10;
         padding:6px 12px; font-size:12px;
         background:linear-gradient(180deg,#fff 0%,#f8f8f0 100%);
         border:3px solid #d4cfc3; border-radius:16px;
         color:#8b7355; font-weight:800; letter-spacing:.02em; line-height:1.6;
         font-variant-numeric:tabular-nums; white-space:pre; pointer-events:none;
         box-shadow:0 4px 14px rgba(61,52,40,.18); }

  /* 操作卡（右下）：开关 + 滤镜一行 */
  #panel { position:absolute; right:14px; bottom:14px; z-index:10;
           max-width:min(62vw, 720px);
           display:flex; align-items:center; gap:8px; padding:8px 10px;
           background:rgb(247,243,223); border:1.5px solid #c4b89e; border-radius:50px;
           box-shadow:0 4px 14px rgba(61,52,40,.18); }

  /* 开关：primary 按钮（3D 像素堆叠阴影，hover 抬起 active 下沉）；运行中转 danger 红 */
  #toggle { flex:none; height:38px; padding:0 16px; font-size:13px; font-weight:600;
            font-family:inherit; letter-spacing:.02em; line-height:1; cursor:pointer;
            border-radius:50px; border:2px solid #f8f8f0; background:#f8f8f0; color:#794f27;
            box-shadow:0 5px 0 0 #bdaea0; transition:all .15s cubic-bezier(.4,0,.2,1); }
  #toggle:hover { box-shadow:0 6px 0 0 #bdaea0; transform:translateY(-1px); }
  #toggle:active { box-shadow:0 1px 0 0 #bdaea0; transform:translateY(2px); }
  #toggle.on { background:#e05a5a; border-color:#e05a5a; color:#fff;
               box-shadow:0 5px 0 0 #c94444; }
  #toggle.on:hover { box-shadow:0 6px 0 0 #c94444; }
  #toggle.on:active { box-shadow:0 1px 0 0 #c94444; }

  /* 滤镜区：单行横向滚动 */
  #styles { display:flex; gap:5px; overflow-x:auto; padding:2px; min-width:0;
            scrollbar-width:thin; scrollbar-color:#c4b89e transparent; }

  /* 风格 chip：Tabs 标签样式（激活 = 青底奶油字） */
  .chip { flex:none; padding:5px 11px; border-radius:24px; cursor:pointer; white-space:nowrap;
          color:#725d42; font-weight:600; font-size:12px; user-select:none;
          transition:all .25s cubic-bezier(.4,0,.2,1); }
  .chip:hover { background:rgba(25,200,185,.1); }
  .chip.active { background:#0cc0b5; color:#fff9e3; }
  /* 预热中：Button loading 斜条纹动画 */
  .chip.loading { color:#fff;
                  background:repeating-linear-gradient(-45deg,#0ec4b6 0 10px,#01b0a7 10px 20px);
                  background-size:28.28px 28.28px;
                  animation:btn-loading 1s linear infinite; }
  .chip.loading::before { content:"⟳ "; }
  @keyframes btn-loading { to { background-position:-28.28px 0; } }

  /* 齿轮：轮巡设置入口（同 toggle 的 3D 像素质感，方形） */
  #gear { flex:none; width:38px; height:38px; font-size:16px; line-height:1; cursor:pointer;
          border-radius:14px; border:2px solid #f8f8f0; background:#f8f8f0; color:#794f27;
          box-shadow:0 5px 0 0 #bdaea0; transition:all .15s cubic-bezier(.4,0,.2,1); }
  #gear:hover  { box-shadow:0 6px 0 0 #bdaea0; transform:translateY(-1px); }
  #gear:active { box-shadow:0 1px 0 0 #bdaea0; transform:translateY(2px); }

  /* 轮巡配置面板：羊皮纸卡片浮层，管风格开关+顺序 */
  #config { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
            background:rgba(61,52,40,.4); backdrop-filter:blur(2px); }
  #config[hidden] { display:none; }
  #config-card { width:min(88vw,420px); max-height:80vh; display:flex; flex-direction:column; padding:16px;
                 background:linear-gradient(180deg,#fff 0%,#f8f8f0 100%);
                 border:3px solid #d4cfc3; border-radius:22px;
                 box-shadow:0 14px 34px rgba(61,52,40,.4); }
  #config-head { display:flex; align-items:center; gap:8px; margin-bottom:12px;
                 color:#8b7355; font-weight:800; font-size:16px; }
  #config-head span { font-size:11px; font-weight:600; color:#a89a7d; }
  #config-refresh, #config-close { width:28px; height:28px; border:none; border-radius:10px;
                  background:#efe9d3; color:#8b7355; font-weight:800; font-size:13px; cursor:pointer; }
  #config-refresh { margin-left:auto; }
  #config-list { overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:2px; }
  .crow { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:14px;
          background:#f8f8f0; border:2px solid #e6dfce; transition:opacity .2s; }
  .crow.off { opacity:.45; }
  .cname { flex:1; font-weight:700; color:#725d42; font-size:14px; }
  .cpill { flex:none; min-width:46px; text-align:center; padding:4px 0; border-radius:12px;
           font-size:11px; font-weight:800; cursor:pointer; user-select:none; }
  .cpill.on  { background:#0cc0b5; color:#fff9e3; }
  .cpill.off { background:#d9d2c2; color:#8b7355; }
  .cgrip { flex:none; width:22px; text-align:center; cursor:grab; touch-action:none;
           color:#bcae92; font-size:16px; line-height:1; user-select:none; }
  .cthumb { flex:none; width:56px; height:32px; border-radius:8px; object-fit:cover; background:#e6dfce; }
  .cthumb.ph { background:repeating-linear-gradient(-45deg,#ece5d3 0 6px,#e2dac6 6px 12px);
               background-size:16.97px 16.97px; animation:btn-loading 1.2s linear infinite; }
  .crow.dragging { opacity:.95; border-color:#0cc0b5; background:#fff;
                   box-shadow:0 6px 16px rgba(61,52,40,.3); }
</style>

<div id="stage">
  <div id="hud">loading…</div>
  <div id="panel">
    <button id="toggle">▶ 开启</button>
    <div id="styles"></div>
    <button id="gear" title="轮巡设置">⚙</button>
  </div>
  <div id="tvbox">
    <div id="tv">
      <div id="mirror">
        <video id="cam" autoplay playsinline muted></video>
        <img id="styled" alt="">
      </div>
    </div>
  </div>
  <div id="config" hidden>
    <div id="config-card">
      <div id="config-head">轮巡风格 <span>拖 ⠿ 排序 · 点启用</span><button id="config-refresh" title="用当前画面重生成预览">🔄</button><button id="config-close">✕</button></div>
      <div id="config-list"></div>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

// ---- 配置 ----
// 同源路径，由 web-serve.py 转发到 FLUX 后端（本地 / HTTPS 反代都走这条）
const SERVER = "/generate";
const GW = 672, GH = 384;    // 送 FLUX 的尺寸（≈16:9，像素量≈512²，显存安全；和摄像头同比例不变形）
const STYLES = [
  { name:"动漫",     p:"Japanese anime, cel-shaded linework, large expressive eyes, flat vibrant colors" },
  { name:"吉卜力",   p:"Studio Ghibli hand-painted watercolor, soft pastel palette, storybook atmosphere" },
  { name:"皮克斯3D", p:"Pixar-style 3D animation, smooth skin, big friendly eyes, soft cinematic lighting" },
  { name:"赛博朋克", p:"cyberpunk, teal-and-magenta neon rim lighting, rainy futuristic neon city background" },
  { name:"水墨",     p:"traditional Chinese ink-wash painting, flowing black brushstrokes, rice-paper texture" },
  { name:"美漫",     p:"American comic book, bold ink outlines, halftone dot shading, saturated colors" },
  { name:"梵高",     p:"Van Gogh Starry Night style, swirling turbulent brushstrokes, vivid cobalt blue and chrome yellow impasto" },
  { name:"浮世绘",   p:"Japanese ukiyo-e woodblock print, flat colors, bold outlines, Hokusai wave patterns, washi paper texture" },
  { name:"克里姆特", p:"Gustav Klimt golden portrait, ornate gold-leaf patterns, mosaic decorative background, Art Nouveau elegance" },
  { name:"波普",     p:"Andy Warhol pop art screen print, high-contrast posterized portrait, bold flat color blocks" },
  { name:"黑白漫画", p:"black-and-white Japanese manga, screentone shading, sharp ink lines, dramatic speed lines background" },
  { name:"敦煌",     p:"Dunhuang Buddhist cave mural, mineral pigments, flying apsara ribbons, ochre and malachite green, aged fresco texture" },
  { name:"年画",     p:"Chinese New Year woodblock print, festive red and gold, bold folk-art outlines, auspicious floral border" },
  { name:"黑色电影", p:"1940s film noir, dramatic black-and-white, venetian-blind shadows, smoky atmosphere, hard key light" },
  { name:"立体主义", p:"Picasso cubism, fragmented geometric facets, multiple viewpoints at once, bold angular color planes" },
  { name:"马蒂斯",   p:"Henri Matisse paper cut-out collage, bold flat organic color shapes, playful composition, matte paper texture" },
];
const wrap = s => `Restyle this photo into ${s}. Keep the person's face, identity and position in the frame.`;
// 手势换风格：取景框「收起」→ 切下一个。MIN_SPAN=对角线占屏宽，小于即算「空了」
const MIN_SPAN = 0.12;
const SMOOTH = 0.35;    // 角点指数平滑系数（越小越稳但越粘手，越大越跟手但越抖）
const OPEN_MS = 120;    // 取景框「真举过」至少这么久才算一次有效开合——1~2 帧误检时长≈0，不会凭空切
const CLOSE_MS = 600;   // 看不到超过这么久才算「收起」→ 切风格——桥接 MediaPipe 追踪瞬断，防误切也防闪

const cam = document.getElementById("cam");
const styled = document.getElementById("styled");
const mirror = document.getElementById("mirror");
const hud = document.getElementById("hud");
// 占位图：没连后端也能看到/调试取景框效果（FLUX 出图后被替换）
const svg = t => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='672' height='384'><rect width='672' height='384' fill='#1a1a2e'/><text x='336' y='200' fill='#9af' font-size='30' text-anchor='middle' font-family='sans-serif'>${t}</text></svg>`);
styled.src = svg("取景框预览");

// ---- 状态 ----
let running = false, current = null, curName = "—", lastGen = "—", frameOn = false, ready = true, backendOk = false;

// ---- 控制栏 ----
const toggleBtn = document.getElementById("toggle");
toggleBtn.onclick = () => {
  running = !running;
  if (running) ready = false;            // 开启后第一张也走「预热中」
  toggleBtn.textContent = running ? "⏸ 暂停" : "▶ 开启";
  toggleBtn.classList.toggle("on", running);
};
const stylesEl = document.getElementById("styles");
const chips = [];

// ---- 轮巡配置：cfg 覆盖全部风格（开关+顺序），rot = 启用后的实际轮巡列表 ----
const CFG_KEY = "blinkface-cfg-v1";
let cfg = loadCfg();          // [{ref, on}] 按显示顺序，含全部 STYLES
let rot = [];                 // 启用的风格对象，按 cfg 顺序

function loadCfg() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(CFG_KEY)) || []; } catch {}
  const byName = new Map(STYLES.map(s => [s.name, s]));
  const out = [], seen = new Set();
  for (const it of saved) {                       // 先按存档顺序（跳过代码里已删除的风格）
    const ref = byName.get(it?.name);
    if (ref && !seen.has(ref.name)) { out.push({ ref, on: it.on !== false }); seen.add(ref.name); }
  }
  for (const s of STYLES)                          // 代码新增、存档没有的：默认启用追加末尾
    if (!seen.has(s.name)) out.push({ ref: s, on: true });
  return out;
}
function saveCfg() {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg.map(c => ({ name: c.ref.name, on: c.on })))); } catch {}
}

function idx() { return Math.max(0, rot.indexOf(current)); }   // 当前风格在 rot 里的位置
function syncActive() {                  // 高亮当前 chip + 自动滚到可见（inline:center；block:nearest 不动页面）
  const i = idx();
  chips.forEach((c, k) => c.classList.toggle("active", k === i));
  chips[i]?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}
function pick(i) {                        // 选/切到 rot 里第 i 个（手势或点击都走这里）
  current = rot[(i % rot.length + rot.length) % rot.length];
  curName = current.name;
  ready = false;                          // 旧风格图停显，等新风格好；预热状态在 chip 上闪烁
  syncActive();
}
function renderChips() {                  // 按 rot 重建主栏 chip（可见即可轮巡）
  stylesEl.textContent = ""; chips.length = 0;
  rot.forEach((s, k) => {
    const c = document.createElement("div");
    c.className = "chip"; c.textContent = s.name;
    c.onclick = () => pick(k);
    stylesEl.appendChild(c); chips.push(c);
  });
}
function rebuildRotation() {              // cfg 变了 → 重算 rot、重建 chip、保持当前选中稳定
  rot = cfg.filter(c => c.on).map(c => c.ref);
  if (!rot.length) rot = [cfg[0].ref];    // 永不为空（配置层已挡到最后一个，这里兜底）
  const prev = current;
  if (!current || !rot.includes(current)) current = rot[0];
  if (current !== prev) { curName = current.name; ready = false; }   // 当前风格真变了才重新预热
  renderChips(); syncActive();
}
rebuildRotation();

// ---- 配置浮层：拖拽排序 + 启用开关 + 每风格预览图，改动实时生效并存档 ----
const gearBtn = document.getElementById("gear");
const configEl = document.getElementById("config");
const configList = document.getElementById("config-list");
gearBtn.onclick = () => {
  configEl.hidden = false; renderConfig();
  if (!previewSnap) refreshPreviews(); else fillPreviews(previewGen);   // 首开生成；再开补齐缺的
};
document.getElementById("config-close").onclick = () => configEl.hidden = true;
document.getElementById("config-refresh").onclick = () => refreshPreviews();
configEl.onclick = e => { if (e.target === configEl) configEl.hidden = true; };   // 点遮罩关

function toggleCfg(i) {
  if (cfg[i].on && cfg.filter(c => c.on).length <= 1) return;   // 至少留一个启用
  cfg[i].on = !cfg[i].on;
  saveCfg(); rebuildRotation(); renderConfig();
}

// —— 拖拽排序（pointer 事件，鼠标/触屏通用；越过相邻行中线即换位）——
let dragPos = -1;
function markDrag() { [...configList.children].forEach((r, k) => r.classList.toggle("dragging", k === dragPos)); }
function startDrag(e, i) {
  e.preventDefault();
  dragPos = i; markDrag();
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
}
function onDragMove(e) {
  const rows = [...configList.children];
  if (dragPos > 0 && e.clientY < mid(rows[dragPos - 1])) return swapCfg(dragPos, dragPos - 1);
  if (dragPos < rows.length - 1 && e.clientY > mid(rows[dragPos + 1])) return swapCfg(dragPos, dragPos + 1);
}
function mid(row) { const b = row.getBoundingClientRect(); return b.top + b.height / 2; }
function swapCfg(i, j) {
  [cfg[i], cfg[j]] = [cfg[j], cfg[i]];
  dragPos = j; renderConfig(); markDrag();
}
function endDrag() {
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", endDrag);
  dragPos = -1;
  saveCfg(); rebuildRotation();            // 排完序才落到轮巡 + 存档
}

// —— 预览图：拿当前画面给每个风格各生成一张小图，本会话内存缓存 ——
const PW = 192, PH = 108;
const pcv = document.createElement("canvas"); pcv.width = PW; pcv.height = PH;
const pctx = pcv.getContext("2d");
const previews = new Map();     // name → blobURL
let previewSnap = null;         // 生成预览用的画面快照(b64)
let previewGen = 0;             // 代次：refresh 一次 +1，旧任务见 gen 不符自动作废

function refreshPreviews() {
  if (!cam.videoWidth) return;
  pctx.drawImage(cam, 0, 0, cam.videoWidth, cam.videoHeight, 0, 0, PW, PH);
  previewSnap = pcv.toDataURL("image/jpeg", 0.85).split(",")[1];
  previews.forEach(u => URL.revokeObjectURL(u)); previews.clear();
  renderConfig();
  fillPreviews(++previewGen);
}
async function fillPreviews(gen) {
  for (const c of cfg) {
    if (gen !== previewGen || configEl.hidden) return;      // 已 refresh 或已关闭 → 停
    if (previews.has(c.ref.name)) continue;
    try {
      const r = await fetch(SERVER, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: wrap(c.ref.p), image: previewSnap, width: PW, height: PH, steps: 2 }),
      });
      if (!r.ok) throw 0;
      if (gen !== previewGen) return;
      previews.set(c.ref.name, URL.createObjectURL(await r.blob()));
      renderConfig();
    } catch { /* 后端离线/出错：留占位，下次 refresh 再试 */ }
  }
}

function renderConfig() {
  configList.textContent = "";
  cfg.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "crow" + (c.on ? "" : " off") + (i === dragPos ? " dragging" : "");

    const grip = document.createElement("div");
    grip.className = "cgrip"; grip.textContent = "⠿";
    grip.onpointerdown = e => startDrag(e, i);

    let thumb;
    if (previews.has(c.ref.name)) {
      thumb = document.createElement("img"); thumb.className = "cthumb"; thumb.alt = "";
      thumb.src = previews.get(c.ref.name);
    } else {
      thumb = document.createElement("div"); thumb.className = "cthumb ph";   // 占位斜条纹
    }

    const name = document.createElement("div");
    name.className = "cname"; name.textContent = c.ref.name;

    const pill = document.createElement("div");
    pill.className = "cpill " + (c.on ? "on" : "off"); pill.textContent = c.on ? "启用" : "关闭";
    pill.onpointerdown = e => e.stopPropagation();   // 点开关别误触拖拽
    pill.onclick = () => toggleCfg(i);

    row.append(grip, thumb, name, pill);
    configList.appendChild(row);
  });
}

// 轮询后端健康，状态显示在 HUD（每 3s）
const HEALTH = "/health";
setInterval(async () => {
  try { backendOk = (await fetch(HEALTH, { signal: AbortSignal.timeout(2500) })).ok; }
  catch { backendOk = false; }
}, 3000);

// ---- 摄像头 ----
const stream = await navigator.mediaDevices.getUserMedia({ video: { width:1280, height:720 } });
cam.srcObject = stream; await cam.play();

// ---- MediaPipe 手部追踪 ----
const fileset = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
const hands = await HandLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate: "GPU",
  },
  runningMode: "VIDEO", numHands: 2,
  minHandDetectionConfidence: 0.6,   // 调高些减少误检
  minHandPresenceConfidence: 0.5,
  minTrackingConfidence: 0.5,        // 跟踪别太高，免得频繁丢手
});

// 归一化关键点 → 镜像层像素坐标（考虑 object-fit:cover 的缩放裁剪；不翻 x，镜像由容器统一处理）
function mapPt(lm) {
  const W = mirror.clientWidth, H = mirror.clientHeight, vw = cam.videoWidth, vh = cam.videoHeight;
  const sc = Math.max(W / vw, H / vh), dw = vw * sc, dh = vh * sc;
  return { x: (W - dw) / 2 + lm.x * dw, y: (H - dh) / 2 + lm.y * dh };
}
// 每手取 食指尖(8)+拇指尖(4)，按手分组定左右（比 4 点全局排序稳，手倾斜也不翻）
function quadFromHands(lms) {
  const pair = lms.map(h => [mapPt(h[8]), mapPt(h[4])]);
  pair.sort((a, b) => (a[0].x + a[1].x) - (b[0].x + b[1].x));   // 左手在前
  const byY = p => [...p].sort((a, b) => a.y - b.y);            // 上、下
  const [lt, lb] = byY(pair[0]), [rt, rb] = byY(pair[1]);
  return [lt, rt, rb, lb];   // TL, TR, BR, BL 顺时针
}
function isFrame(lms) {
  if (lms.length < 2) return false;
  const ext = h => Math.hypot(h[8].x-h[0].x, h[8].y-h[0].y) > Math.hypot(h[6].x-h[0].x, h[6].y-h[0].y);
  return lms.every(ext);
}

// ---- 高帧率：追踪手 + 更新 clip-path（60fps）----
let lastVideoTime = -1, fps = 0, lastT = performance.now(), sq = null, lastPresentT = 0, openStartT = 0;
function loop() {
  const t = performance.now();
  if (cam.currentTime !== lastVideoTime) {
    lastVideoTime = cam.currentTime;
    const lms = hands.detectForVideo(cam, t).landmarks || [];
    // 有效取景框 = 两手 + 对角线足够大（合拢/放下都会让它"空"）
    if (isFrame(lms)) {
      const raw = quadFromHands(lms);
      if (Math.hypot(raw[0].x - raw[2].x, raw[0].y - raw[2].y) / mirror.clientWidth > MIN_SPAN) {
        lastPresentT = t;                  // 见到就即时更新 → 跟手
        // 指数平滑消抖；重新打开（sq 已清）时直接对齐，不从旧位置滑入
        sq = sq ? sq.map((p, i) => ({ x: p.x + (raw[i].x - p.x) * SMOOTH, y: p.y + (raw[i].y - p.y) * SMOOTH })) : raw;
      }
    }
    // 「取景框在」= 最近 CLOSE_MS 内见过：桥接追踪瞬断（不闪、不误切），见到即时贴 → 跟手
    const on = !!sq && t - lastPresentT < CLOSE_MS;
    if (on && !frameOn) { frameOn = true; openStartT = lastPresentT; }        // 打开边沿
    if (!on && frameOn) {                                                     // 收起边沿
      frameOn = false;
      if (lastPresentT - openStartT >= OPEN_MS) pick(idx() + 1);              // 真举过 ≥OPEN_MS 才切，滤误检
      sq = null;
    }
    // 显示：在 = 即时贴角点（跟手 + 桥接瞬断）；风格图没就绪则露真实画面
    if (on && ready) {
      styled.style.clipPath = `polygon(${sq.map(p => `${p.x}px ${p.y}px`).join(",")})`;
      styled.style.display = "block";
    } else {
      styled.style.display = "none";
    }
  }
  // 当前风格未就绪 = 预热中 → 对应 chip 闪烁提示
  chips.forEach((c, k) => c.classList.toggle("loading", k === idx() && running && !ready));
  const now = performance.now(); fps = fps*0.9 + (1000/(now-lastT))*0.1; lastT = now;
  hud.textContent = `后端 ${backendOk ? "🟢" : "🔴"}  fps ${fps.toFixed(0)}\n`
    + `${curName} · ${lastGen}\n收起取景框 → 换风格`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- 低帧率：开启时不停把整帧送 FLUX，回来换全图 ----
const grab = document.createElement("canvas"); grab.width = GW; grab.height = GH;
const gctx = grab.getContext("2d");
const sleep = ms => new Promise(r => setTimeout(r, ms));
function frameB64() {                                   // 整帧（未镜像）缩到 GW×GH
  gctx.drawImage(cam, 0, 0, cam.videoWidth, cam.videoHeight, 0, 0, GW, GH);
  return grab.toDataURL("image/jpeg", 0.9).split(",")[1];
}
async function fluxLoop() {
  while (true) {
    if (!running) { await sleep(150); continue; }
    const myStyle = current;                           // 记下这张是给哪个风格生成的
    try {
      const r = await fetch(SERVER, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: wrap(myStyle.p), image: frameB64(), width: GW, height: GH, steps: 2 }),
      });
      if (!r.ok) throw new Error(r.status);
      const blob = await r.blob();
      if (myStyle !== current) continue;               // 风格已被切走 → 这张过期，丢弃不显示
      const url = URL.createObjectURL(blob);
      if (styled.src.startsWith("blob:")) URL.revokeObjectURL(styled.src);
      styled.src = url; ready = true;     // 当前风格就绪 → chip 停止闪烁，取景框开始显示
      lastGen = `${r.headers.get("X-Gen-Seconds") ?? "?"}s`;
    } catch (e) {
      lastGen = "err " + e.message; await sleep(1000);
    }
  }
}
fluxLoop();
</script>
